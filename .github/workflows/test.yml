name: DineDesk Access Control Integration Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  execute-security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository Workspace
        uses: actions/checkout@v4

      - name: Initialize Stable Node.js Runtime environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Secure Project Dependencies
        run: npm ci

      - name: Execute Access Control Security Test Suite
        run: npm test
