name: Secure Secret Verification Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-configuration-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm DEMO_API_KEY is configured safely
        env:
          DEMO_API_KEY: ${{ secrets.DINEDESK_DEMO_KEY }}
        run: |
          if [ -z "$DEMO_API_KEY" ]; then
            echo "::error::DEMO_API_KEY is missing from configurations"; exit 1
          fi
          echo "DEMO_API_KEY is successfully verified. The raw payload value is masked and never printed."
